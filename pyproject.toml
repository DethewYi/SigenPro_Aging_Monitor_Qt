[project]
name = "sigenpro-aging-monitor"
version = "1.2.0"
description = "储能产品老化监控系统"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5",
    "pyqtgraph>=0.13",
    "pymysql>=1.1",
    "psycopg2-binary>=2.9",
    "pyserial>=3.5",
    "openpyxl>=3.1",
    "fpdf2>=2.7",
]

[project.scripts]
sigenpro = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
